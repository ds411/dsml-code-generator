# The configuration of the PRD model. Story #68 uses it for the golden
# findings in tests/golden/validate/:
#
#     uv run dsml validate --config docs/model/prd/dsml.toml
#
# The short name of each requirement is its PRD ID, for example
# PRD-CORE-012. Thus the key ids.requirement must accept these IDs, or rule
# STR-003 reports each requirement (PRD-DSML-051).
schema = 1

[model]
paths = ["."]

[ids]
requirement = '(R|PRD-[A-Z]+)-[0-9]{3,}'
