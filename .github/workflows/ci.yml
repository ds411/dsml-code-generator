# CI of the DSML toolchain. This is a hand-written workflow, not a
# generated pipeline.
#
# trace: PRD-TOP-003, PRD-CORE-020, PRD-CORE-027, PRD-CORE-029, PRD-CORE-035, PRD-CORE-049,
# PRD-VAL-008
#
# CI runs only on Linux x64 (Q62, decision record 07). The toolchain
# still supports the operating systems of decision record 03 (Q50).
# Each third-party action has a full commit SHA, with its version in a
# comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the older run of that pull
# request. Each push to main gets its own group, so a newer push does not
# cancel or replace a run on main, and each commit on main keeps its result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv installs Python at the version in .python-version.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      # The action reads the pnpm version from the "packageManager" field
      # of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install the Python dependencies
        run: uv sync --frozen

      # pnpm also installs the Node.js runtime that package.json gives.
      - name: Install the Node.js dev tools
        run: pnpm install --frozen-lockfile

      # Rule TID251 stops an import of opensysml outside the IR adapter
      # module (PRD-CORE-020).
      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Check the format
        run: uv run ruff format --check

      # The templates must give their output in the format of the pinned
      # formatter (PRD-CORE-035). This step runs the formatter in check mode
      # on the golden files: "ruff format" for Python. The formatters of the
      # other file types come with their generators.
      - name: Check the format of the golden files
        run: uv run ruff format --check --no-cache tests/golden

      - name: Check the types
        run: pnpm typecheck

      # Get sysml-grpc of the pinned version before the work and check its
      # SHA-256 hash against src/dsml/versions.toml (PRD-CORE-049). After
      # this step, a start of OpenSysML does not use the network.
      - name: Get sysml-grpc and check its hash
        run: uv run python -m dsml.adapter.binary

      # Before each start, the toolchain checks the SHA-256 hash of
      # sysml-grpc (PRD-CORE-049). The script writes the start time and the
      # parse times for docs/notes/opensysml-0.9.2.md.
      - name: Start OpenSysML and measure the times
        run: uv run python scripts/measure_opensysml.py

      # The script writes the time of dsml ir for a model with 1,000
      # elements for docs/notes/ir-performance.md (story #33, Q50).
      - name: Measure the IR time for 1,000 elements
        run: uv run python scripts/measure_ir.py

      # The golden IR tests in tests/test_ir_command.py compare the IR of the
      # reference models with tests/golden/ir/ (PRD-CORE-027, PRD-CORE-029).
      - name: Test
        run: uv run pytest

      # The example model must have no error finding (story #68). The
      # findings of the reference models are also golden files, which the
      # step "Test" compares in tests/test_rule_catalog.py.
      - name: Validate the example model
        run: uv run dsml validate --config docs/model/examples/dsml.toml

      # trace: PRD-VAL-003, PRD-VAL-015
      # The phase 2 reference model "order portal" must have no error finding
      # (story #166, M9 exit criterion). The step "Test" compares its
      # findings with tests/golden/validate/order-portal.findings.*.
      - name: Validate the order portal model
        run: uv run dsml validate --config docs/model/examples/order-portal/dsml.toml

      # trace: PRD-TOP-011, PRD-VAL-015
      # The PRD model must have no error finding (story #138, M7 exit
      # criterion).
      - name: Validate the PRD model
        run: uv run dsml validate --config docs/model/prd/dsml.toml

      # trace: PRD-TRACE-010, PRD-TRACE-012, PRD-TRACE-013, PRD-TRACE-014
      # The toolchain traces its own PRD model (story #138). dsml-prd.toml
      # names the folders src/ and tests/ for the trace comments.
      # docs/notes/prd-model-trace.md gives the result.
      - name: Write the trace reports of the PRD model
        run: |
          mkdir -p "$RUNNER_TEMP/prd-trace"
          for report in coverage orphans; do
            uv run dsml trace "$report" --config dsml-prd.toml --output "$RUNNER_TEMP/prd-trace/$report.html"
          done

      - name: Keep the trace reports of the PRD model
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prd-trace-reports
          path: ${{ runner.temp }}/prd-trace/
          if-no-files-found: error

      # The golden workflows of the pipeline generator must have no
      # actionlint error (story #83). The step downloads the actionlint
      # release of src/dsml/versions.toml and checks its SHA-256 hash.
      # actionlint also runs shellcheck on the "run" scripts.
      - name: Lint the golden workflows
        run: |
          version="$(uv run python -c 'from dsml.versions import pinned_version as v; print(v("actionlint"))')"
          sha256="$(uv run python -c 'from dsml.versions import load_baseline as b; print(b()["actionlint-sha256"].value)')"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "${sha256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color tests/golden/pipelines/*/.github/workflows/*.yml

      # trace: PRD-CORE-047
      # The release workflow must have no actionlint error (story #141).
      - name: Lint the release workflow
        run: '"$RUNNER_TEMP/actionlint" -color .github/workflows/release.yml'

  # trace: PRD-CORE-030, PRD-APP-012, PRD-APP-013, PRD-APP-113, PRD-APP-114, PRD-APP-124,
  # PRD-APP-128, PRD-APP-132, PRD-APP-133, PRD-APP-135
  #
  # The golden output of the FastAPI generator (story #75) must pass the
  # tools of the generated project. The job copies each golden project to a
  # temporary folder, because uv lock writes uv.lock and the generator does
  # not write lockfiles (PRD-CORE-036). This job needs the network to
  # install the dependencies of the generated projects. The generator does
  # not use the network (PRD-TOP-004).
  #
  # The golden projects are the example model (order-service), the test
  # model tests/models/fastapi/shop.sysml (shop, story #84) and the order
  # portal model (order-portal, story #164). The tests of the order portal
  # project show the CORS headers (PRD-APP-136). The HTTP tests and the
  # migrations (story #85) use the PostgreSQL 18 service container. The
  # image has a pinned digest. Each project gets the folder and the
  # database of its golden name.
  fastapi-golden:
    name: FastAPI golden project (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username app --dbname app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROJECT: ${{ github.workspace }}/../order-service
      PROJECTS: order-service/services/order-api shop/services/shop-api order-portal/services/order-api
      DATABASE_HOST: 127.0.0.1
      DATABASE_USER: app
      DATABASE_PASSWORD: ci
      DATABASE_SSL_MODE: disable
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      - name: Copy the golden projects
        run: |
          for project in $PROJECTS; do
            cp -r "tests/golden/fastapi/$project" "$GITHUB_WORKSPACE/../${project%%/*}"
          done

      - name: Lock and install the dependencies
        run: |
          for project in $PROJECTS; do
            cd "$GITHUB_WORKSPACE/../${project%%/*}"
            uv lock
            uv sync --frozen
          done

      - name: Lint
        run: |
          for project in $PROJECTS; do
            cd "$GITHUB_WORKSPACE/../${project%%/*}"
            uv run --frozen ruff check --output-format=github
          done

      - name: Check the format
        run: |
          for project in $PROJECTS; do
            cd "$GITHUB_WORKSPACE/../${project%%/*}"
            uv run --frozen ruff format --check
          done

      - name: Check the types
        run: |
          for project in $PROJECTS; do
            cd "$GITHUB_WORKSPACE/../${project%%/*}"
            uv run --frozen pyright
          done

      # Each project uses its own database. The HTTP tests must run: the
      # step fails if pytest skips a test.
      - name: Test
        run: |
          set -o pipefail
          for project in $PROJECTS; do
            name="${project%%/*}"
            cd "$GITHUB_WORKSPACE/../$name"
            export DATABASE_NAME="${name//-/_}"
            PGPASSWORD="$DATABASE_PASSWORD" psql --host "$DATABASE_HOST" --username "$DATABASE_USER" \
              --dbname app --command "CREATE DATABASE \"$DATABASE_NAME\""
            uv run --frozen pytest -p no:cacheprovider | tee "$RUNNER_TEMP/pytest-$name.txt"
            if grep --quiet "skipped" "$RUNNER_TEMP/pytest-$name.txt"; then
              echo "pytest skipped tests of $name. The HTTP tests must run."
              exit 1
            fi
          done

      # app/migrate_gen.py must apply the missing migrations and then stop.
      # A second run must apply nothing (PRD-APP-128). "alembic check" then
      # compares the database with the SQLAlchemy models (PRD-APP-124).
      # Each project uses a new database, not the database of the tests.
      - name: Apply the migrations to PostgreSQL
        env:
          APP_ENVIRONMENT: ci
          AWS_REGION: eu-west-1
          COGNITO_USER_POOL_ID: eu-west-1_ci
          COGNITO_APP_CLIENT_ID: ci
          CORS_ALLOWED_ORIGINS: https://portal.ci
        run: |
          set -o pipefail
          for project in $PROJECTS; do
            name="${project%%/*}"
            cd "$GITHUB_WORKSPACE/../$name"
            export DATABASE_NAME="${name//-/_}_migrations"
            PGPASSWORD="$DATABASE_PASSWORD" psql --host "$DATABASE_HOST" --username "$DATABASE_USER" \
              --dbname app --command "CREATE DATABASE \"$DATABASE_NAME\""
            uv run --frozen python -m app.migrate_gen | tee "$RUNNER_TEMP/first-$name.txt"
            grep --quiet "Applied the migrations" "$RUNNER_TEMP/first-$name.txt"
            uv run --frozen python -m app.migrate_gen | tee "$RUNNER_TEMP/second-$name.txt"
            grep --quiet "No migration was applied" "$RUNNER_TEMP/second-$name.txt"
            uv run --frozen alembic check
          done

      - name: Build the container image
        working-directory: ${{ env.PROJECT }}
        run: docker build --tag order-api:test .

      # The container must answer GET /healthz with HTTP 200 and no token
      # (PRD-APP-012). Its user must not be root (PRD-APP-013).
      - name: Start the container and get GET /healthz
        run: |
          test "$(docker run --rm --entrypoint id order-api:test -u)" != "0"
          docker run --detach --name order-api --publish 8000:8000 \
            --env APP_ENVIRONMENT=ci --env AWS_REGION=eu-west-1 \
            --env COGNITO_USER_POOL_ID=eu-west-1_ci --env COGNITO_APP_CLIENT_ID=ci \
            --env DATABASE_HOST=db.invalid --env DATABASE_NAME=orders \
            --env DATABASE_USER=app --env DATABASE_PASSWORD=ci order-api:test
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/healthz; then
              echo
              docker logs order-api
              docker rm --force order-api
              exit 0
            fi
            sleep 1
          done
          docker logs order-api
          exit 1

      # A missing mandatory environment variable must stop the application
      # with a message that names the variable (PRD-APP-132).
      - name: Start the container with no configuration
        run: |
          if docker run --rm order-api:test > output.txt 2>&1; then
            echo "The container started with no configuration."
            exit 1
          fi
          cat output.txt
          grep --quiet "APP_ENVIRONMENT" output.txt

      # trace: PRD-CORE-045, PRD-APP-116, PRD-APP-117
      # Generated code calls a hand-written handler through a typed
      # interface (story #88). A hand-written handler of the operation
      # cancel_order must pass the type check. Then the step puts the
      # generated files of a changed model into the project: the in
      # parameter orderId has the new name orderKey. The type check must
      # then fail on the handler. This step changes the project, thus it is
      # the last step of the job.
      - name: Check the typed interface of a custom operation
        working-directory: ${{ env.PROJECT }}
        run: |
          check="$GITHUB_WORKSPACE/tests/golden/fastapi/handler-check"
          slice="app/features/order/cancel_order"
          cp "$check/handler.py" "$slice/handler.py"
          uv run --frozen pyright
          cp "$check/endpoint_gen.py" "$check/schemas_gen.py" "$slice/"
          if uv run --frozen pyright > "$RUNNER_TEMP/pyright.txt"; then
            cat "$RUNNER_TEMP/pyright.txt"
            echo "The type check found no error in the handler of the changed model."
            exit 1
          fi
          cat "$RUNNER_TEMP/pyright.txt"
          grep --quiet "$slice/handler.py.*order_id" "$RUNNER_TEMP/pyright.txt"

  # trace: PRD-CORE-011, PRD-CORE-030, PRD-CORE-035, PRD-APP-201, PRD-APP-211, PRD-APP-225, PRD-APP-226
  # trace: PRD-APP-227, PRD-APP-228, PRD-APP-233, PRD-APP-234, PRD-APP-009, PRD-APP-222, PRD-APP-223
  # trace: PRD-CORE-029, PRD-APP-016
  #
  # The golden output of the React generator (story #167) must pass the
  # tools of the generated project. Prettier must find no change in the
  # golden files (PRD-CORE-035). Story #177: the job writes the full output
  # of the order portal with "dsml generate" in a temporary folder, with
  # the order portal model and its configuration file. The React output
  # must agree with the golden files. Then dsml check-output runs on the
  # FastAPI application and on the React application (PRD-APP-016). The
  # output is in a temporary folder, because "pnpm install" and "uv lock"
  # write lockfiles and the generator does not write lockfiles
  # (PRD-CORE-036). This job needs the network to install the dependencies
  # of the generated projects. The generator does not use the network
  # (PRD-TOP-004).
  react-golden:
    name: React golden project (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHECK: ${{ github.workspace }}/../check-output
      PROJECT: ${{ github.workspace }}/../check-output/apps/order-portal
      EXTERNAL: ${{ github.workspace }}/../check-external
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      # The action reads the pnpm version from the "packageManager" field
      # of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # pnpm also installs the Node.js runtime that package.json gives.
      - name: Install the Node.js dev tools
        run: pnpm install --frozen-lockfile

      - name: Check the format of the golden files
        run: pnpm exec prettier --check tests/golden/react tests/react

      # The configuration file gives the output folder services/order-api
      # for the application orderApi and apps/order-portal for the
      # application orderPortal.
      - name: Write the full output of the order portal
        run: |
          mkdir -p "$CHECK"
          cp docs/model/examples/order-portal/dsml.toml docs/model/examples/order-portal/order-portal.sysml "$CHECK/"
          cd "$CHECK"
          uv run --project "$GITHUB_WORKSPACE" dsml generate

      # The golden folder also has the manifests in .dsml/. In the full
      # output, the manifests are in the folder of the configuration file.
      - name: Compare the React output with the golden files
        run: diff -r --exclude=.dsml tests/golden/react/order-portal "$PROJECT"

      # The projects have no lockfiles, thus pnpm and uv make them.
      - name: Install the dependencies
        run: |
          cd "$PROJECT"
          pnpm install --no-frozen-lockfile
          cd "$CHECK/services/order-api"
          uv lock
          uv sync --frozen

      # dsml check-output runs ruff and pyright on the FastAPI application,
      # and tsc, ESLint and Steiger from node_modules/.bin of the React
      # application (PRD-CORE-011, PRD-APP-016, PRD-APP-234). The tools of
      # the FastAPI application come from PATH. Thus the step puts the
      # virtual environment of the generated project first on PATH: it has
      # the pinned ruff and pyright.
      - name: Check the full output with dsml check-output
        working-directory: ${{ env.CHECK }}
        run: |
          export PATH="$CHECK/services/order-api/.venv/bin:$PATH"
          uv run --project "$GITHUB_WORKSPACE" dsml check-output

      # Story #175: the golden project of the external API model. The
      # application petPortal calls an imported OpenAPI file (PRD-APP-006).
      # The IR adapter reads the file relative to the current folder.
      - name: Copy the golden project of the external API model
        run: |
          mkdir -p "$EXTERNAL/apps" "$EXTERNAL/tests/models/react/external-api"
          cp tests/models/react/external-api/dsml.toml tests/models/react/external-api/external-api.sysml "$EXTERNAL/"
          cp tests/models/react/external-api/pet-store.openapi.json "$EXTERNAL/tests/models/react/external-api/"
          cp -r tests/golden/react/external-api "$EXTERNAL/apps/pet-portal"

      - name: Install the dependencies of the external API project
        working-directory: ${{ env.EXTERNAL }}/apps/pet-portal
        run: pnpm install --no-frozen-lockfile

      - name: Check the external API project with dsml check-output
        working-directory: ${{ env.EXTERNAL }}
        run: uv run --project "$GITHUB_WORKSPACE" dsml check-output --application petPortal

      # The Zod schemas must accept and refuse the same values as the
      # Pydantic models (PRD-APP-211). tests/test_react_entities.py gives
      # the same values to the Pydantic models. The shared layer tests
      # examine the runtime configuration, Amplify Auth and the API client
      # (PRD-APP-227, PRD-APP-230, PRD-APP-231, PRD-APP-232). The component
      # tests of the features layer render the forms in jsdom. They examine
      # the field errors, the problem details errors, the keyboard access
      # and the invalidation of the queries (PRD-APP-225 to PRD-APP-228).
      # The component tests of the widgets layer examine the column
      # headers, the paging and the keyboard access (PRD-APP-114,
      # PRD-APP-228). The component tests of the app layer examine the
      # login with no session, the "not permitted" page, the route loaders
      # and the navigation (PRD-APP-009, PRD-APP-222, PRD-APP-223).
      - name: Copy the Vitest tests
        run: |
          mkdir -p "$PROJECT/tests"
          cp -r tests/react/app tests/react/features tests/react/field-rules tests/react/shared tests/react/widgets "$PROJECT/tests/"

      - name: Test
        working-directory: ${{ env.PROJECT }}
        run: pnpm exec vitest run

      # "pnpm build" must write the static files to dist/. The build must
      # not contain environment values (PRD-APP-233). The marker values
      # must not go into dist/, and dist/ must have no config.json: the
      # deployment pipeline writes it for each environment.
      - name: Build the static files
        working-directory: ${{ env.PROJECT }}
        env:
          VITE_API_BASE_URL: https://dsml-environment-marker.example
          VITE_USER_POOL_ID: dsml-environment-marker-pool
          API_BASE_URL: https://dsml-environment-marker.example
        run: |
          pnpm build
          test -f dist/index.html
          test ! -e dist/config.json
          if grep -r -l -E "dsml-environment-marker|amazoncognito\.com" dist; then
            echo "::error::The build contains an environment value."
            exit 1
          fi

  # trace: PRD-CORE-011, PRD-CORE-030, PRD-CORE-035, PRD-APP-010, PRD-APP-012, PRD-APP-013
  # trace: PRD-APP-015, PRD-APP-016, PRD-APP-128, PRD-APP-301, PRD-APP-306, PRD-APP-325
  # trace: PRD-APP-331, PRD-APP-332, PRD-APP-333, PRD-APP-009, PRD-APP-314, PRD-APP-320
  # trace: PRD-APP-324, PRD-CORE-029
  #
  # The golden project of the Next.js generator (story #180) must pass the
  # tools of the generated project. Prettier must find no change in the
  # golden files (PRD-CORE-035). The schema snapshot in .dsml/ is canonical
  # JSON (Q16), thus Prettier does not examine it. The migrations of the
  # golden project (story #182) use the PostgreSQL 18 service container.
  # Story #189: the job writes the full output of the order web with "dsml
  # generate", and the output must agree with the golden files. Then dsml
  # check-output runs on the full output, and the container starts with
  # PostgreSQL after the migrations.
  # The image has a pinned digest. The project is in a temporary folder,
  # because "pnpm install" writes a lockfile and the generator does not
  # write lockfiles (PRD-CORE-036). This job needs the network to install
  # the dependencies of the generated project and to build the container
  # image. The generator does not use the network (PRD-TOP-004).
  nextjs-golden:
    name: Next.js golden project (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username app --dbname app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHECK: ${{ github.workspace }}/../check-web
      PROJECT: ${{ github.workspace }}/../check-web/apps/order-web
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      # The action reads the pnpm version from the "packageManager" field
      # of package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # pnpm also installs the Node.js runtime that package.json gives.
      - name: Install the Node.js dev tools
        run: pnpm install --frozen-lockfile

      - name: Check the format of the golden files
        run: pnpm exec prettier --check tests/golden/nextjs tests/nextjs '!**/.dsml/**'

      # The configuration file of the order web gives the output folder
      # apps/order-web for the application orderWeb.
      - name: Write the full output of the order web
        run: |
          mkdir -p "$CHECK"
          cp docs/model/examples/order-web/dsml.toml docs/model/examples/order-web/order-web.sysml "$CHECK/"
          cd "$CHECK"
          uv run --project "$GITHUB_WORKSPACE" dsml generate

      # The golden manifests are in tests/golden/nextjs/.dsml/. In the full
      # output, the manifests are in the folder of the configuration file.
      - name: Compare the Next.js output with the golden files
        run: diff -r tests/golden/nextjs/order-web "$PROJECT"

      # The project has no lockfile, thus pnpm makes it.
      - name: Install the dependencies
        working-directory: ${{ env.PROJECT }}
        run: pnpm install --no-frozen-lockfile

      # dsml check-output runs tsc, ESLint and Steiger from
      # node_modules/.bin of the Next.js application (PRD-CORE-011,
      # PRD-APP-016, PRD-APP-306, story #185). With no option, the command
      # checks each application of the full output (story #189).
      - name: Check the full output with dsml check-output
        working-directory: ${{ env.CHECK }}
        run: uv run --project "$GITHUB_WORKSPACE" dsml check-output

      # The auth tests examine the role check, the server helper authorize
      # with test tokens and the redirect of the request interceptor
      # (PRD-APP-008, PRD-APP-323, PRD-APP-324). The features and widgets
      # tests render the client components of the slices. They examine the
      # requests to the route handlers under /api (PRD-APP-314,
      # PRD-APP-321). The routes tests send HTTP requests to the route
      # handlers with the PostgreSQL service container (PRD-APP-008,
      # PRD-APP-113, PRD-APP-114, PRD-APP-311, PRD-APP-312, PRD-APP-313).
      # The pages tests examine the role checks of the pages, the server
      # functions in the pages and the navigation (PRD-APP-009,
      # PRD-APP-314, PRD-APP-324).
      - name: Copy the Vitest tests
        run: |
          mkdir -p "$PROJECT/tests"
          cp -r tests/nextjs/auth tests/nextjs/features tests/nextjs/pages tests/nextjs/routes tests/nextjs/widgets "$PROJECT/tests/"

      - name: Make the database of the HTTP tests
        env:
          PGPASSWORD: ci
        run: psql --host 127.0.0.1 --username app --dbname app --command "CREATE DATABASE order_web_routes"

      - name: Test
        working-directory: ${{ env.PROJECT }}
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_NAME: order_web_routes
          DATABASE_USER: app
          DATABASE_PASSWORD: ci
          DATABASE_SSL_MODE: disable
        run: pnpm exec vitest run

      # "next build" must not change tsconfig.json. The build must not
      # contain environment values (PRD-APP-010, PRD-APP-325): the marker
      # values of the environment must not go into .next/.
      - name: Build the application
        working-directory: ${{ env.PROJECT }}
        env:
          AWS_REGION: dsml-environment-marker
          COGNITO_USER_POOL_ID: dsml-environment-marker-pool
          NEXT_PUBLIC_USER_POOL_ID: dsml-environment-marker-pool
        run: |
          pnpm build
          test -f .next/standalone/server.js
          diff "$GITHUB_WORKSPACE/tests/golden/nextjs/order-web/tsconfig.json" tsconfig.json
          if grep -r -l "dsml-environment-marker" .next; then
            echo "::error::The build contains an environment value."
            exit 1
          fi

      # The image installs the dependencies from the lockfile of the
      # install step.
      - name: Build the container image
        working-directory: ${{ env.PROJECT }}
        run: docker build --tag order-web:test .

      # The container must answer GET /healthz with HTTP 200 and no token
      # (PRD-APP-012). Its user must not be root (PRD-APP-013). The log
      # line of the request must be JSON with the request ID (PRD-APP-015).
      # The root layout must give the public runtime values of the
      # environment of the container to the page (PRD-APP-325). The request
      # interceptor must send a request for a protected page with no
      # session to the login (PRD-APP-323). A route handler under /api must
      # give HTTP 401 with problem details to a request with no session
      # (PRD-APP-008, PRD-APP-014, PRD-APP-310). The home page must show
      # with no session (PRD-APP-320).
      - name: Start the container and get GET /healthz
        run: |
          test "$(docker run --rm --entrypoint id order-web:test -u)" != "0"
          docker run --detach --name order-web --publish 3000:3000 \
            --env AWS_REGION=eu-west-1 --env COGNITO_USER_POOL_ID=eu-west-1_runtimeMarker \
            --env COGNITO_APP_CLIENT_ID=ci --env COGNITO_LOGIN_DOMAIN=login.ci order-web:test
          for attempt in $(seq 1 30); do
            if curl --silent --fail --header "X-Request-ID: ci-healthz" http://127.0.0.1:3000/healthz; then
              echo
              curl --silent http://127.0.0.1:3000/ > page.html || true
              curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' http://127.0.0.1:3000/orders > redirect.txt || true
              curl --silent --output api.json --write-out '%{http_code} %{content_type}' http://127.0.0.1:3000/api/orders > api.txt || true
              docker logs order-web > logs.txt
              cat logs.txt
              docker rm --force order-web
              echo "Redirect of /orders: $(cat redirect.txt)"
              grep --quiet "eu-west-1_runtimeMarker" page.html
              grep --quiet "Select a view in the navigation." page.html
              test "$(cat redirect.txt)" = "307 http://127.0.0.1:3000/auth/login?next=%2Forders"
              echo "Response of /api/orders: $(cat api.txt) $(cat api.json)"
              test "$(cat api.txt)" = "401 application/problem+json"
              jq --exit-status '.status == 401' api.json
              grep '"requestId":"ci-healthz"' logs.txt | jq --exit-status '.path == "/healthz" and .status == 200'
              exit 0
            fi
            sleep 1
          done
          docker logs order-web
          exit 1

      # The image must run "node migrate.gen.mjs" (PRD-APP-332). The command
      # must apply the missing migrations and then stop. A second run must
      # apply nothing (PRD-APP-128). The table "order" must then have the
      # columns of the Drizzle schema.
      - name: Apply the migrations to PostgreSQL
        env:
          PGPASSWORD: ci
        run: |
          set -o pipefail
          psql --host 127.0.0.1 --username app --dbname app --command "CREATE DATABASE order_web_migrations"
          migrate() {
            docker run --rm --network host --env DATABASE_HOST=127.0.0.1 \
              --env DATABASE_NAME=order_web_migrations --env DATABASE_USER=app \
              --env DATABASE_PASSWORD=ci --env DATABASE_SSL_MODE=disable \
              order-web:test node migrate.gen.mjs
          }
          migrate | tee first.txt
          jq --exit-status '.message == "Applied the migrations 0001_create_order.gen."' first.txt
          migrate | tee second.txt
          jq --exit-status '.message | contains("No migration was applied")' second.txt
          psql --host 127.0.0.1 --username app --dbname order_web_migrations --tuples-only \
            --command "SELECT string_agg(column_name, ',' ORDER BY column_name) FROM information_schema.columns WHERE table_name = 'order'" \
            | tee columns.txt
          grep --quiet "id,note,status,total" columns.txt

      # Story #189: the container starts with the database of the previous
      # step, after the migrations. It must answer GET /healthz with HTTP
      # 200, and a route handler under /api must give HTTP 401 with no
      # session (PRD-APP-012, PRD-APP-332).
      - name: Start the container with PostgreSQL and get GET /healthz
        run: |
          docker run --detach --name order-web-database --network host \
            --env DATABASE_HOST=127.0.0.1 --env DATABASE_NAME=order_web_migrations \
            --env DATABASE_USER=app --env DATABASE_PASSWORD=ci --env DATABASE_SSL_MODE=disable \
            --env AWS_REGION=eu-west-1 --env COGNITO_USER_POOL_ID=eu-west-1_ci \
            --env COGNITO_APP_CLIENT_ID=ci --env COGNITO_LOGIN_DOMAIN=login.ci order-web:test
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/healthz; then
              echo
              code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/orders)"
              docker logs order-web-database
              docker rm --force order-web-database
              echo "Status of /api/orders: $code"
              test "$code" = "401"
              exit 0
            fi
            sleep 1
          done
          docker logs order-web-database
          exit 1

  # trace: PRD-IAC-003, PRD-IAC-039, PRD-IAC-040, PRD-CORE-035
  #
  # The golden HCL of the infrastructure generator must pass the language
  # tools and the IaC security scan (story #86). The job downloads the tools
  # of src/dsml/versions.toml and checks their SHA-256 hashes. "tofu init"
  # and "terraform init" get the AWS provider from the registries. The
  # generator does not use the network (PRD-TOP-004).
  infrastructure-golden:
    name: Infrastructure golden HCL (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOOLS: ${{ github.workspace }}/../hcl-tools
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/../plugin-cache
      TF_IN_AUTOMATION: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      - name: Install the HCL tools
        run: |
          # pin NAME gives the version, or else the value, of one item of the
          # version baseline.
          pin() {
            python3 -c 'import sys, tomllib; item = tomllib.load(open(sys.argv[1], "rb"))[sys.argv[2]]; print(item.get("version") or item["value"])' \
              src/dsml/versions.toml "$1"
          }
          # get URL FILE SHA256 downloads one release archive and checks its hash.
          get() {
            curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$2" "$1"
            echo "$3  $RUNNER_TEMP/$2" | sha256sum --check --strict
          }
          mkdir -p "$TOOLS" "$TF_PLUGIN_CACHE_DIR"
          tofu="$(pin opentofu)"
          get "https://github.com/opentofu/opentofu/releases/download/v${tofu}/tofu_${tofu}_linux_amd64.zip" \
            tofu.zip "$(pin opentofu-sha256)"
          terraform="$(pin terraform)"
          get "https://releases.hashicorp.com/terraform/${terraform}/terraform_${terraform}_linux_amd64.zip" \
            terraform.zip "$(pin terraform-sha256)"
          tflint="$(pin tflint)"
          get "https://github.com/terraform-linters/tflint/releases/download/v${tflint}/tflint_linux_amd64.zip" \
            tflint.zip "$(pin tflint-sha256)"
          ruleset="$(pin tflint-ruleset-aws)"
          get "https://github.com/terraform-linters/tflint-ruleset-aws/releases/download/v${ruleset}/tflint-ruleset-aws_linux_amd64.zip" \
            ruleset.zip "$(pin tflint-ruleset-aws-sha256)"
          unzip -q -o "$RUNNER_TEMP/tofu.zip" tofu -d "$TOOLS"
          unzip -q -o "$RUNNER_TEMP/terraform.zip" terraform -d "$TOOLS"
          unzip -q -o "$RUNNER_TEMP/tflint.zip" tflint -d "$TOOLS"
          plugins="$HOME/.tflint.d/plugins/github.com/terraform-linters/tflint-ruleset-aws/${ruleset}"
          mkdir -p "$plugins"
          unzip -q -o "$RUNNER_TEMP/ruleset.zip" tflint-ruleset-aws -d "$plugins"
          echo "$TOOLS" >> "$GITHUB_PATH"
          echo "CHECKOV_VERSION=$(pin checkov)" >> "$GITHUB_ENV"

      # The templates must give their output in the format of the pinned
      # formatter (PRD-CORE-035).
      - name: Check the format of the golden HCL
        run: tofu fmt -check -recursive -diff tests/golden/infrastructure

      # Each root module is a folder with a file versions.gen.tf. The step
      # copies each golden output to a temporary folder, because init writes
      # the lock file and the folder .terraform.
      - name: Validate and lint each root module
        run: |
          set -o pipefail
          copy="$RUNNER_TEMP/golden-hcl"
          cp -r tests/golden/infrastructure "$copy"
          config="$GITHUB_WORKSPACE/.tflint.hcl"
          status=0
          for root in $(find "$copy" -name versions.gen.tf -printf '%h\n' | sort); do
            echo "::group::${root#"$copy"/}"
            # The commands use "&&", because "set -e" has no effect on the
            # left side of "||".
            (
              cd "$root" &&
                tofu init -backend=false -input=false -no-color &&
                tofu validate -no-color &&
                rm -rf .terraform .terraform.lock.hcl &&
                terraform init -backend=false -input=false -no-color &&
                terraform validate -no-color &&
                tflint --config "$config" --call-module-type=local --format=compact
            ) || status=1
            echo "::endgroup::"
          done
          exit "$status"

      # trace: PRD-CORE-011, PRD-IAC-038
      # dsml check-output must pass on the golden output of the order
      # service (story #134). A path in the configuration file cannot
      # contain "..". Thus the step copies the output and writes the
      # configuration file in a temporary folder. tflint uses the AWS rule
      # set of the step "Install the HCL tools".
      - name: Check the golden HCL with dsml check-output
        run: |
          check="$RUNNER_TEMP/check-output"
          mkdir -p "$check"
          cp -r tests/golden/infrastructure/order-service/infra "$check/infra"
          printf 'schema = 1\n\n[infrastructure]\noutput = "infra"\n' > "$check/dsml.toml"
          uv run dsml check-output --infrastructure --config "$check/dsml.toml"

      # .checkov.yaml gives the settings and the skipped checks.
      - name: Scan the golden HCL with Checkov
        run: uv tool run "checkov@${CHECKOV_VERSION}" --config-file .checkov.yaml --directory tests/golden/infrastructure
