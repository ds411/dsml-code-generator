# Check of the DSML library with the OMG pilot implementation. This is a
# hand-written workflow, not a generated pipeline.
#
# trace: PRD-DSML-005
#
# Decision record 05 (Q60) selects this check. The job downloads the pinned
# release of the pilot Jupyter kernel (src/dsml/versions.toml), checks its
# SHA-256 hash and sends the library to the kernel. Then it sends the
# example model, the PRD model and the test models of the library, each
# together with the library (story #27). The job runs only on Linux x64,
# and only when the library, a model or the check changes.
name: Pilot

on:
  pull_request:
    paths:
      - ".github/workflows/pilot.yml"
      - "docs/model/examples/**"
      - "docs/model/prd/**"
      - "scripts/check_pilot.py"
      - "src/dsml/library/**"
      - "src/dsml/versions.toml"
      - "tests/models/dsml/**"
      - "tests/models/pilot/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pilot.yml"
      - "docs/model/examples/**"
      - "docs/model/prd/**"
      - "scripts/check_pilot.py"
      - "src/dsml/library/**"
      - "src/dsml/versions.toml"
      - "tests/models/dsml/**"
      - "tests/models/pilot/**"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the older run of that pull
# request. Each push to main and each manual run gets its own group, so a
# newer push does not cancel or replace it.
concurrency:
  group: pilot-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pilot:
    name: Pilot (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv installs Python at the version in .python-version, and Jupyter
      # (jupyter-client) from the dev group of pyproject.toml.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      - name: Install the Python dependencies
        run: uv sync --frozen

      # The runner image contains Java 21. The pilot kernel needs Java 17 or
      # later.
      - name: Find Java
        run: |
          echo "PILOT_JAVA=${JAVA_HOME_21_X64}/bin/java" >> "$GITHUB_ENV"
          "${JAVA_HOME_21_X64}/bin/java" -version

      - name: Check the DSML library with the pilot kernel
        run: uv run python scripts/check_pilot.py src/dsml/library/DSML.sysml

      # Each model imports the DSML library, thus the library and the model
      # go to the kernel as one cell (--one-model).
      - name: Check the example model with the pilot kernel
        run: >-
          uv run python scripts/check_pilot.py --one-model
          src/dsml/library/DSML.sysml docs/model/examples/order-service.sysml

      - name: Check the PRD model with the pilot kernel
        run: >-
          uv run python scripts/check_pilot.py --one-model
          src/dsml/library/DSML.sysml docs/model/prd/*.sysml

      - name: Check the test models of the library with the pilot kernel
        run: |
          for model in tests/models/dsml/keywords.sysml tests/models/dsml/typed-usage.sysml tests/models/dsml/phase-2.sysml; do
            uv run python scripts/check_pilot.py --one-model src/dsml/library/DSML.sysml "$model"
          done

      # This step makes sure that the check fails for a construct that the
      # pilot kernel does not accept.
      - name: Check that the pilot kernel rejects a bad library
        run: uv run python scripts/check_pilot.py --expect-rejection tests/models/pilot/rejected.sysml
