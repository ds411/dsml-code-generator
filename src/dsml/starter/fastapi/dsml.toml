# The configuration file of the DSML toolchain.
# The reference file configuration.md of the skill dsml-cli gives all keys.
# Run "dsml skills install" to install the skill. docs/configuration.md in
# the toolchain repository gives the same keys.
schema = 1

[model]
paths = ["model"]

# Add one table for each application of the model. <name> is the name of
# the application in the model. The target of phase 1 is FastAPI.
#
# [applications.<name>]
# output = "services/<name>"
