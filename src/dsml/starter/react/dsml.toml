# The configuration of the DSML toolchain.
# The reference file configuration.md of the skill dsml-cli gives all keys.
# Run "dsml skills install" to install the skill. docs/configuration.md in
# the toolchain repository gives the same keys.
schema = 1

[model]
paths = ["model"]

# One table for each application of the model. The key is the name of the
# application in the model. "output" is the output folder of the generated code.
[applications.itemApi]
output = "services/item-api"

[applications.itemPortal]
output = "apps/item-portal"
