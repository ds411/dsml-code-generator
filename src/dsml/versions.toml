# Version baseline of the DSML toolchain (decision record 03, Q49).
#
# "line" is the release line that decision record 03 selects.
# "version" is the exact version. The first phase 1 release sets each
# exact version that is not here yet. Later releases update this file.
# "value" is a fixed setting that is not a version.
#
# This file holds only the phase 1 items. A new decision record sets the
# TypeScript items at the start of phase 2.

schema = 1

# Toolchain and FastAPI target. "version": the Python version of the
# base image of the FastAPI target.
[python]
line = "3.14"
version = "3.14.8"

# SysML v2 engine: the Python client and sysml-grpc (PRD-CORE-018).
[opensysml]
line = "0.9"
version = "0.9.2"

# OMG pilot implementation: the Jupyter kernel (jupyter-sysml-kernel) for
# the CI check of the DSML library (PRD-DSML-005, Q60). The toolchain does
# not use the pilot implementation.
# "pilot-kernel-release": the release tag of SysML-v2-Pilot-Implementation
# on GitHub.
# "pilot-kernel-sha256": the SHA-256 hash of the release archive
# jupyter-sysml-kernel-<version>.zip.
[pilot-kernel]
line = "0.62"
version = "0.62.0"

[pilot-kernel-release]
value = "2026-08"

[pilot-kernel-sha256]
value = "5a015ed3f2b3d2dae14e9c3fb9602d9e1fef5f9ce33cf396c422329405cc3cb2"

# Template engine of the generators: Jinja 3.x, the PyPI package Jinja2
# (story #37, PRD-CORE-035). "version": the newest 3.x release on
# 11 October 2026.
[jinja2]
line = "3"
version = "3.1.6"

# FastAPI target stack (PRD-APP-101). Lines: the newest minor on
# 10 October 2026, the start of phase 1. "version": the newest release of
# the line on 11 October 2026 (story #75).
[fastapi]
line = "0.143"
version = "0.143.0"

[pydantic]
line = "2.14"
version = "2.14.1"

[sqlalchemy]
line = "2.1"
version = "2.1.4"

[alembic]
line = "1.20"
version = "1.20.0"

[pytest]
line = "9.1"
version = "9.1.1"

[uv]
line = "0.13"
version = "0.13.0"

# The ASGI server of the FastAPI target (PRD-APP-133).
[uvicorn]
line = "0.54"
version = "0.54.0"

# The token check of the FastAPI target (PRD-APP-130, story #78): PyJWT
# and the RSA code of cryptography. "version": the newest release of the
# line on 11 October 2026.
[pyjwt]
line = "2.15"
version = "2.15.1"

[cryptography]
line = "50.0"
version = "50.0.2"

# The dev tools of the FastAPI target: the HTTP client of the FastAPI test
# client, the linter and formatter, and the type checker. The toolchain uses
# the same versions of ruff and pyright.
[httpx2]
line = "2.13"
version = "2.13.1"

[ruff]
line = "0.17"
version = "0.17.0"

[pyright]
line = "1.1"
version = "1.1.414"

# The base images of the Dockerfile of the FastAPI target, pinned by digest
# (PRD-APP-013). The digest is the digest of the multi-platform image index.
[python-image]
value = "python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170"

[uv-image]
value = "ghcr.io/astral-sh/uv:0.13.0@sha256:cdc6093146eb3ff6a40107b38f008b789e050e77ad87865e381d9917da55a168"

[postgresql]
line = "18"

# Infrastructure target.
# "version": the OpenTofu release that the generated pipelines install
# (story #83). The newest release of the line on 11 October 2026.
[opentofu]
line = "1.13"
version = "1.13.1"

[terraform]
line = "1.16"

[hcl-required-version]
value = ">= 1.13.0"

# Each root module pins the exact version (PRD-IAC-005, story #76).
# "version": the release that decision record 03 gives, 29 July 2026.
[aws-provider]
line = "6"
version = "6.57.1"

[alb-tls-policy]
value = "ELBSecurityPolicy-TLS13-1-2-2021-06"

[checkov]
line = "3.3"

[github-runner]
value = "ubuntu-24.04"

# The third-party actions of the generated pipelines (PRD-CICD-014, story
# #83). "version": the release tag without "v". "value": the action and the
# full commit SHA of the release tag. The workflows give the version in a
# comment after the SHA. Each version is the newest release on
# 11 October 2026.
[action-checkout]
version = "7.0.1"
value = "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"

[action-configure-aws-credentials]
version = "6.3.0"
value = "aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd"

[action-setup-opentofu]
version = "2.0.2"
value = "opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4"

[action-setup-uv]
version = "10.3.0"
value = "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884"

[action-upload-sarif]
version = "4.38.3"
value = "github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d"

# The linter of GitHub Actions workflows. The toolchain CI runs it on the
# golden workflows (story #83). "actionlint-sha256": the SHA-256 hash of
# the release archive actionlint_<version>_linux_amd64.tar.gz.
[actionlint]
line = "1.7"
version = "1.7.12"

[actionlint-sha256]
value = "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
