# Version baseline of the DSML toolchain (decision record 03, Q49).
#
# "line" is the release line that decision record 03 selects.
# "version" is the exact version. The first phase 1 release sets each
# exact version that is not here yet. Later releases update this file.
# "value" is a fixed setting that is not a version.
#
# This file holds only the phase 1 items. A new decision record sets the
# TypeScript items at the start of phase 2.

schema = 1

# Toolchain and FastAPI target. "version": the Python version of the
# base image of the FastAPI target.
[python]
line = "3.14"
version = "3.14.8"

# SysML v2 engine: the Python client and sysml-grpc (PRD-CORE-018).
[opensysml]
line = "0.9"
version = "0.9.2"

# OMG pilot implementation: the Jupyter kernel (jupyter-sysml-kernel) for
# the CI check of the DSML library (PRD-DSML-005, Q60). The toolchain does
# not use the pilot implementation.
# "pilot-kernel-release": the release tag of SysML-v2-Pilot-Implementation
# on GitHub.
# "pilot-kernel-sha256": the SHA-256 hash of the release archive
# jupyter-sysml-kernel-<version>.zip.
[pilot-kernel]
line = "0.62"
version = "0.62.0"

[pilot-kernel-release]
value = "2026-08"

[pilot-kernel-sha256]
value = "5a015ed3f2b3d2dae14e9c3fb9602d9e1fef5f9ce33cf396c422329405cc3cb2"

# Template engine of the generators: Jinja 3.x, the PyPI package Jinja2
# (story #37, PRD-CORE-035). "version": the newest 3.x release on
# 11 October 2026.
[jinja2]
line = "3"
version = "3.1.6"

# FastAPI target stack (PRD-APP-101). Lines: the newest minor on
# 10 October 2026, the start of phase 1. "version": the newest release of
# the line on 11 October 2026 (story #75).
[fastapi]
line = "0.143"
version = "0.143.0"

[pydantic]
line = "2.14"
version = "2.14.1"

[sqlalchemy]
line = "2.1"
version = "2.1.4"

[alembic]
line = "1.20"
version = "1.20.0"

[pytest]
line = "9.1"
version = "9.1.1"

[uv]
line = "0.13"
version = "0.13.0"

# The ASGI server of the FastAPI target (PRD-APP-133).
[uvicorn]
line = "0.54"
version = "0.54.0"

# The dev tools of the FastAPI target: the HTTP client of the FastAPI test
# client, the linter and formatter, and the type checker. The toolchain uses
# the same versions of ruff and pyright.
[httpx2]
line = "2.13"
version = "2.13.1"

[ruff]
line = "0.17"
version = "0.17.0"

[pyright]
line = "1.1"
version = "1.1.414"

# The base images of the Dockerfile of the FastAPI target, pinned by digest
# (PRD-APP-013). The digest is the digest of the multi-platform image index.
[python-image]
value = "python:3.14.8-slim-trixie@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170"

[uv-image]
value = "ghcr.io/astral-sh/uv:0.13.0@sha256:cdc6093146eb3ff6a40107b38f008b789e050e77ad87865e381d9917da55a168"

[postgresql]
line = "18"

# Infrastructure target.
[opentofu]
line = "1.13"

[terraform]
line = "1.16"

[hcl-required-version]
value = ">= 1.13.0"

# Each root module pins the exact version (PRD-IAC-005, story #76).
# "version": the release that decision record 03 gives, 29 July 2026.
[aws-provider]
line = "6"
version = "6.57.1"

[alb-tls-policy]
value = "ELBSecurityPolicy-TLS13-1-2-2021-06"

[checkov]
line = "3.3"

[github-runner]
value = "ubuntu-24.04"
