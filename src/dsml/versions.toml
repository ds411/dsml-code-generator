# Version baseline of the DSML toolchain (decision record 03, Q49).
#
# "line" is the release line that decision record 03 selects.
# "version" is the exact version. The first phase 1 release sets each
# exact version that is not here yet. Later releases update this file.
# "value" is a fixed setting that is not a version.
#
# Decision record 03 gives the phase 1 items. Decision record 09 (Q64)
# gives the items of the React and Next.js targets.

schema = 1

# Toolchain and FastAPI target. "version": the Python version of the
# base image of the FastAPI target.
[python]
line = "3.14"
version = "3.14.8"

# SysML v2 engine: the Python client and sysml-grpc (PRD-CORE-018).
[opensysml]
line = "0.9"
version = "0.9.2"

# The SHA-256 hashes of the sysml-grpc release assets of the pinned OpenSysML
# version, from the release checksums of OpenSysML (PRD-CORE-049, Q50). The
# name of each item is "sysml-grpc-sha256-" and the platform of the asset
# sysml-grpc-<os>-<arch>. The toolchain starts only a binary with the hash of
# its platform. A platform with no item here has no support.
[sysml-grpc-sha256-darwin-arm64]
value = "f216818f2b37767d1aa7531a692612c7235e64ae9a21efe6b4de13d6832422f4"

[sysml-grpc-sha256-linux-amd64]
value = "8577dacafa512416942639a3b2a7e38dc4a0bd89e64abce2e5e4faca581ee7c3"

[sysml-grpc-sha256-linux-arm64]
value = "289f3fdff259f1a49960abbdead31a9cd7bb4d3789430303d1823beffda1b3cf"

# OMG pilot implementation: the Jupyter kernel (jupyter-sysml-kernel) for
# the CI check of the DSML library (PRD-DSML-005, Q60). The toolchain does
# not use the pilot implementation.
# "pilot-kernel-release": the release tag of SysML-v2-Pilot-Implementation
# on GitHub.
# "pilot-kernel-sha256": the SHA-256 hash of the release archive
# jupyter-sysml-kernel-<version>.zip.
[pilot-kernel]
line = "0.62"
version = "0.62.0"

[pilot-kernel-release]
