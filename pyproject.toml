[project]
name = "dsml"
version = "0.1.0"
description = "DSML toolchain: validation, traceability and code generation for SysML v2 models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = "==3.14.*"
dependencies = [
    "jinja2==3.1.6",
    "opensysml==0.9.2",
]

[project.scripts]
dsml = "dsml.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp==2.3.0",
]

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "jupyter-client==8.10.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
# The PRDs hold code examples, not toolchain code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "TID", "UP", "W"]

# trace: PRD-CORE-020
# Only the IR adapter module can import opensysml. Rule TID251 stops an
# import of opensysml in all other files.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"opensysml".msg = "Only the IR adapter module (src/dsml/adapter/) can import opensysml (PRD-CORE-020)."

[tool.ruff.lint.per-file-ignores]
"src/dsml/adapter/**" = ["TID251"]

# pnpm installs pyright (package.json). Run it with "pnpm typecheck".
[tool.pyright]
include = ["scripts", "src", "tests"]
# The golden FastAPI project has its own dependencies and its own pyright
# settings. The CI job "FastAPI golden project" checks it.
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "tests/golden/fastapi"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests of the golden FastAPI project need its dependencies. The CI job
# "FastAPI golden project" runs them.
addopts = ["-ra", "--strict-config", "--strict-markers", "--ignore=tests/golden"]
xfail_strict = true
# The tests with the mark "mcp" need the optional dependency group "mcp"
# (Q69). Without it, these tests are skipped.
markers = ["mcp: the test needs the MCP Python SDK (the optional dependency group mcp)"]
