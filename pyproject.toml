[project]
name = "dsml"
version = "0.1.0"
description = "DSML toolchain: validation, traceability and code generation for SysML v2 models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = "==3.14.*"
dependencies = []

[project.scripts]
dsml = "dsml.cli:main"

[build-system]
requires = ["uv_build==0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
# The PRDs hold code examples, not toolchain code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]

# pnpm installs pyright (package.json). Run it with "pnpm typecheck".
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
