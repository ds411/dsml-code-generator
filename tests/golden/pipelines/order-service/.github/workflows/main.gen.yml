        working-directory: "services/order-api"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get AWS credentials for the push role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: "arn:aws:iam::111111111111:role/order-service-tooling-ci-push"
          aws-region: "eu-west-1"

      - name: Build and push the image
        id: push
        env:
          REGISTRY: "111111111111.dkr.ecr.eu-west-1.amazonaws.com"
          REPOSITORY: "order-service-tooling-order-api"
        run: |
          image="$REGISTRY/$REPOSITORY:$GITHUB_SHA"
          if ! aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" > /dev/null 2>&1; then
            aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
            docker build --platform linux/amd64 --tag "$image" .
            docker push "$image"
          fi
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ECR gave no image digest for $image."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Deploy the build to dev with the deploy role (PRD-CICD-010,
  # PRD-CICD-012, PRD-CICD-016 to PRD-CICD-018, PRD-CICD-021). The group of
  # each environment is the same in all workflows, and a new run does not
  # cancel a running deployment (PRD-CICD-009).
  deploy-dev:
    name: "Deploy dev"
    needs:
      - build-order-api
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: "dev"
    concurrency:
      group: "deploy-dev"
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: "infra/envs/dev"
    env:
      MODEL_COMMIT: ${{ github.sha }}
      ORDER_API_IMAGE_DIGEST: ${{ needs.build-order-api.outputs.ORDER_API_IMAGE_DIGEST }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false

      - name: Get AWS credentials for the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: "arn:aws:iam::222222222222:role/order-service-dev-ci-deploy"
          aws-region: "eu-west-1"

      - name: Initialize OpenTofu
        run: tofu init -input=false

      # OpenTofu does not show sensitive values (PRD-CICD-015).
      - name: Apply the infrastructure of dev
        run: >-
          tofu apply -input=false -auto-approve -no-color
          -var "model_commit=$MODEL_COMMIT"
          -var "order_api_image_digest=$ORDER_API_IMAGE_DIGEST"

      # Run the migration task of orderApi as a one-off ECS task with the
      # new image, and stop if it fails (PRD-CICD-017).
      - name: "Run the migrations of orderApi"
        env:
          APPLICATION: "orderApi"
          LOG_GROUP: "order-service-dev-api-service"
        run: |
          cluster="$(tofu output -raw api_service_cluster_name)"
          family="$(tofu output -raw api_service_migration_task_definition)"
          security_group="$(tofu output -raw api_service_security_group_id)"
          subnets="$(tofu output -json api_service_private_subnet_ids | jq -r 'join(",")')"
          task_definition="$(aws ecs describe-task-definition --task-definition "$family" --query taskDefinition.taskDefinitionArn --output text)"
          task="$(aws ecs run-task --cluster "$cluster" --task-definition "$task_definition" \
            --launch-type FARGATE --started-by dsml-migration \
            --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_group],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)"
          if [ -z "$task" ] || [ "$task" = "None" ]; then
            echo "::error::ECS did not start the migration task of $APPLICATION. No service changed."
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task"
          exit_code="$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" \
            --query "tasks[0].containers[?name=='app'] | [0].exitCode" --output text)"
          echo "| order-api | \`$task_definition\` | $exit_code | \`$LOG_GROUP\` | \`migration/app/${task##*/}\` |" >> "$RUNNER_TEMP/migrations.md"
          if [ "$exit_code" != "0" ]; then
            echo "::error::The migration task of $APPLICATION failed with the exit code $exit_code. No service changed."
            exit 1
          fi

      # Set the service of orderApi to its new task definition and wait for a
      # steady state. If the circuit breaker rolls back, the job fails
      # (PRD-CICD-018).
      - name: "Roll out orderApi"
        env:
          APPLICATION: "orderApi"
          TASK_FAMILY: "order-service-dev-api-service"
        run: |
          cluster="$(tofu output -raw api_service_cluster_name)"
          service="$(tofu output -raw api_service_service_name)"
          task_definition="$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition.taskDefinitionArn --output text)"
          aws ecs update-service --cluster "$cluster" --service "$service" --task-definition "$task_definition" \
            --query service.serviceArn --output text
          while true; do
            read -r current state <<< "$(aws ecs describe-services --cluster "$cluster" --services "$service" \
              --query "services[0].deployments[?status=='PRIMARY'] | [0].[taskDefinition, rolloutState]" --output text)"
            if [ "$current" != "$task_definition" ] || [ "$state" = "FAILED" ]; then
              echo "::error::The deployment circuit breaker rolled back the service of $APPLICATION."
              exit 1
            fi
            if [ "$state" = "COMPLETED" ]; then
              break
            fi
            sleep 15
          done
          aws ecs wait services-stable --cluster "$cluster" --services "$service"
          echo "| order-api | \`$task_definition\` |" >> "$RUNNER_TEMP/services.md"

