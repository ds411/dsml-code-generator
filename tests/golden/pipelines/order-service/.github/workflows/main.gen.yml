    shell: bash

jobs:
  # Build the image of orderApi one time and push it to the ECR
  # repository of the tooling account with the push role (PRD-CICD-007,
  # PRD-CICD-010). The tag is the commit. The tags are immutable, thus a
  # second run of the same commit uses the image of the first run.
  build-order-api:
    name: "Build orderApi"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      ORDER_API_IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
    defaults:
