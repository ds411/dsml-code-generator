# Generated by dsml 0. Do not edit.
# Elements: OrderService, OrderService::dev, OrderService::orderApi

name: Pull request

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSML_VERSION: "0.1.0"
  PYTHON_VERSION: "3.14"

jobs:
  # Validate the model and upload the findings to GitHub code scanning
  # (PRD-CICD-002).
  validate:
    name: Validate the model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      # The index URL is in the repository variable DSML_INDEX_URL.
      - name: Install the DSML toolchain
        env:
          INDEX_URL: ${{ vars.DSML_INDEX_URL }}
        run: uv tool install --python "$PYTHON_VERSION" --index "$INDEX_URL" "dsml==$DSML_VERSION"

      - name: Validate the model
        run: dsml validate --format sarif --output dsml.sarif

      - name: Upload the findings to code scanning
        if: ${{ !cancelled() && hashFiles('dsml.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: dsml.sarif
          category: dsml

  # Fail if a generated file is different from the committed file
  # (PRD-CICD-003).
  generate-check:
    name: Check the generated files
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      # The index URL is in the repository variable DSML_INDEX_URL.
      - name: Install the DSML toolchain
        env:
          INDEX_URL: ${{ vars.DSML_INDEX_URL }}
        run: uv tool install --python "$PYTHON_VERSION" --index "$INDEX_URL" "dsml==$DSML_VERSION"

      - name: Check the generated files
        run: dsml generate --check

  # Run the language tools on the generated code (PRD-CICD-005).
  check-output:
    name: Check the generated code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      # The index URL is in the repository variable DSML_INDEX_URL.
      - name: Install the DSML toolchain
        env:
          INDEX_URL: ${{ vars.DSML_INDEX_URL }}
        run: uv tool install --python "$PYTHON_VERSION" --index "$INDEX_URL" "dsml==$DSML_VERSION"

      - name: Check the generated code
        run: dsml check-output

  # Install the dependencies of orderApi from the committed lockfile, then
  # run the linter, the type checker and the tests (PRD-CICD-004).
  test-order-api:
    name: "Test orderApi"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: "services/order-api"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"

      # A lockfile that does not agree with pyproject.toml makes the job fail.
      - name: Check the lockfile
        run: uv lock --check

      - name: Install the dependencies from the lockfile
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check --output-format=github

      - name: Check the format
        run: uv run --frozen ruff format --check

      - name: Check the types
        run: uv run --frozen pyright

      - name: Test
        run: uv run --frozen pytest

  # Plan the infrastructure of dev with the read-only plan role
  # (PRD-CICD-006, PRD-CICD-010). The job does not apply. The plan role
  # cannot write the state lock, thus the plan does not lock the state.
  # OpenTofu does not show sensitive values in the plan text
  # (PRD-CICD-015).
  plan-dev:
    name: "Plan dev"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: "infra/envs/dev"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false

      - name: Get AWS credentials for the plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: "arn:aws:iam::222222222222:role/order-service-dev-ci-plan"
          aws-region: "eu-west-1"

      - name: Initialize OpenTofu
        run: tofu init -input=false

      - name: Plan dev
        env:
          MODEL_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: tofu plan -input=false -lock=false -no-color -var "model_commit=$MODEL_COMMIT" -out=plan.tfplan

      - name: Write the plan in the job summary
        run: |
          {
            echo "## Plan of dev"
            echo
            echo '```text'
            tofu show -no-color plan.tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
