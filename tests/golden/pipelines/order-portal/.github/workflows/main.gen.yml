  # workflow artifact (PRD-CICD-007, PRD-APP-233). The files contain no
  # value of an environment. The deploy jobs write /config.json for each
  # environment. A second run of the job replaces the artifact.
  build-order-portal:
    name: "Build orderPortal"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
